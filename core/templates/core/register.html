<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - FarmRent</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            background:
                linear-gradient(
                    rgba(0, 80, 40, 0.08),
                    rgba(0, 80, 40, 0.08)
                ),
                #f5f7f5;

            color: #222;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {

            background: #176b3a;

            padding: 18px 8%;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {

            color: white;

            font-size: 28px;

            font-weight: bold;
        }


        nav a {

            color: white;

            text-decoration: none;

            margin-left: 25px;

            font-size: 16px;
        }


        nav a:hover {

            color: #f4b400;
        }


        /* =========================
           REGISTER SECTION
        ========================= */

        .register-section {

            min-height: 80vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;
        }


        .register-card {

            width: 100%;

            max-width: 480px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.10);
        }


        .register-card h1 {

            text-align: center;

            color: #176b3a;

            font-size: 32px;

            margin-bottom: 8px;
        }


        .register-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }


        /* =========================
           ERROR
        ========================= */

        .error-message {

            background: #fdeaea;

            color: #c62828;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            color: #444;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        .form-group input:focus {

            border-color: #176b3a;

            box-shadow:
                0 0 0 2px rgba(23,107,58,0.10);
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-btn {

            width: 100%;

            background: #176b3a;

            color: white;

            border: none;

            padding: 13px;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        .register-btn:hover {

            background: #0f542d;
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }


        .login-link a {

            color: #176b3a;

            text-decoration: none;

            font-weight: bold;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            background: #123d27;

            color: white;

            text-align: center;

            padding: 25px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            nav {

                flex-direction: column;

                gap: 15px;
            }


            nav a {

                margin-left: 8px;

                margin-right: 8px;
            }


            .register-card {

                padding: 30px 20px;
            }


            .register-card h1 {

                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav>

    <div class="logo">
        🚜 FarmRent
    </div>


    <div>

        <a href="/">
            Home
        </a>

        <a href="/equipment/">
            Equipment
        </a>

        <a href="/login/">
            Login
        </a>

    </div>

</nav>



<!-- =========================
     REGISTER
========================= -->

<section class="register-section">


    <div class="register-card">


        <h1>
            Create Account
        </h1>


        <p class="register-subtitle">
            Join FarmRent and start renting equipment.
        </p>



        {% if error %}

            <div class="error-message">

                {{ error }}

            </div>

        {% endif %}



        <form
            method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email address"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>


        </form>



        <div class="login-link">

            Already have an account?

            <a href="/login/">
                Login here
            </a>

        </div>


    </div>

</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 FarmRent |
        Smart Online Farming Equipment Rental System
    </p>

</footer>


</body>

</html>
